<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puti-AI | 研習課堂線上報到</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 50%, #F5F3FF 100%);
      min-height: 100vh;
    }
  </style>
</head>
<body class="p-4 sm:p-6 flex flex-col justify-between items-center text-slate-800">
  <div class="w-full max-w-lg bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl border border-indigo-100 p-6 sm:p-8 mt-2 mb-8">
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-300 mb-3">
        <i class="fa-solid fa-graduation-cap text-2xl"></i>
      </div>
      <h1 class="text-2xl font-black tracking-tight text-indigo-950">研習工作坊 ‧ 數位報到</h1>
      <p class="text-sm font-medium text-slate-500 mt-1">花蓮縣國小國語文輔導團 ✕ 數位四學與 AI 實戰</p>
    </div>

    <!-- Form -->
    <form id="checkinForm" class="space-y-4">
      <!-- 學校 -->
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
          <i class="fa-solid fa-school text-indigo-500"></i> 服務學校 <span class="text-rose-500">*</span>
        </label>
        <input type="text" name="school" required placeholder="例如：花蓮縣北濱國小"
          class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-slate-50 focus:bg-white text-sm">
      </div>

      <!-- 姓名與年資 -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
            <i class="fa-solid fa-user text-indigo-500"></i> 教師姓名 <span class="text-rose-500">*</span>
          </label>
          <input type="text" name="name" required placeholder="姓名"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-slate-50 focus:bg-white text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
            <i class="fa-solid fa-clock-rotate-left text-indigo-500"></i> 教學年資
          </label>
          <select name="years" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-slate-50 focus:bg-white text-sm">
            <option value="1~3年（熱血新手）">1~3年（熱血新手）</option>
            <option value="4~10年（穩健中生代）" selected>4~10年（穩健中生代）</option>
            <option value="11~20年（資深骨幹）">11~20年（資深骨幹）</option>
            <option value="21年以上（大師專家）">21年以上（大師專家）</option>
          </select>
        </div>
      </div>

      <!-- 教學痛點 -->
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
          <i class="fa-solid fa-circle-exclamation text-amber-500"></i> 目前教學上的痛點或困擾？
        </label>
        <textarea name="painPoints" rows="2" placeholder="例如：學生字詞吸收慢、差異化批改花太多時間、課堂討論參與度不高..."
          class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-slate-50 focus:bg-white text-sm resize-none"></textarea>
      </div>

      <!-- 想用 AI 解決什麼問題 -->
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
          <i class="fa-solid fa-wand-magic-sparkles text-indigo-500"></i> 今天最想用 AI 幫你解決什麼問題？
        </label>
        <textarea name="aiGoal" rows="2" placeholder="例如：快速出題、生字造句引導、產出引起動機的故事與學習單..."
          class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-slate-50 focus:bg-white text-sm resize-none"></textarea>
      </div>

      <!-- 對 AI 教學的擔憂 -->
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
          <i class="fa-solid fa-shield-halved text-rose-500"></i> 你對 AI 融入教學最大的擔憂是什麼？
        </label>
        <textarea name="aiConcern" rows="2" placeholder="例如：學生過度依賴不動腦、AI 產出內容有幻覺、軟體操作太複雜課堂翻車..."
          class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-slate-50 focus:bg-white text-sm resize-none"></textarea>
      </div>

      <!-- 提交按鈕 -->
      <button type="submit" id="submitBtn"
        class="w-full mt-4 py-3.5 px-6 rounded-2xl bg-gradient-to-r from-indigo-600 via-indigo-700 to-violet-700 text-white font-bold text-base shadow-lg shadow-indigo-300 hover:shadow-indigo-400 hover:scale-[1.01] active:scale-[0.99] transition flex items-center justify-center gap-2">
        <span>完成報到並同步至大螢幕</span>
        <i class="fa-solid fa-arrow-right text-sm"></i>
      </button>
    </form>

    <!-- 成功畫面 -->
    <div id="successBox" class="hidden text-center py-8 space-y-4">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-emerald-100 text-emerald-600 mb-2 animate-bounce">
        <i class="fa-solid fa-check text-4xl"></i>
      </div>
      <h2 class="text-2xl font-black text-slate-800">報到成功！🎉</h2>
      <p class="text-sm text-slate-600 leading-relaxed">
        感謝老師的回饋！您的資料已即時同步到講台儀表板。<br>請抬頭看看前方大螢幕的名冊與點名盤！
      </p>
      <button onclick="window.location.reload()" class="mt-4 px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold transition">
        再填寫一筆
      </button>
    </div>
  </div>

  <!-- 底部版權宣告 -->
  <footer class="text-center text-xs text-slate-500 max-w-xl pb-4">
    <p>屏東縣後庄國小黃朝榮老師作品，免費分享，歡迎擴散推廣，嚴禁商用與任何侵權、不尊重著作權的行為，更多 Puti-AI 教學工具 <a href="https://padlet.com/clongwh/puti_ai_tools" target="_blank" class="text-indigo-600 font-bold underline hover:text-indigo-800">點此前往</a></p>
  </footer>

  <script>
    const form = document.getElementById('checkinForm');
    const submitBtn = document.getElementById('submitBtn');
    const successBox = document.getElementById('successBox');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 正在傳送報到資料...';

      const formData = new FormData(form);
      const payload = {
        school: formData.get('school'),
        name: formData.get('name'),
        years: formData.get('years'),
        painPoints: formData.get('painPoints'),
        aiGoal: formData.get('aiGoal'),
        aiConcern: formData.get('aiConcern')
      };

      // 如果在 Apps Script 環境中
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) {
            form.classList.add('hidden');
            successBox.classList.remove('hidden');
          })
          .withFailureHandler(function(err) {
            alert('傳送失敗：' + err);
            submitBtn.disabled = false;
            submitBtn.innerHTML = '重新提交報到';
          })
          .saveCheckin(payload);
      } else {
        // 本地預覽或獨立 Web App 提交模式 (POST)
        fetch(window.location.href, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
          form.classList.add('hidden');
          successBox.classList.remove('hidden');
        })
        .catch(err => {
          // 本機靜態測試 fallback
          form.classList.add('hidden');
          successBox.classList.remove('hidden');
        });
      }
    });
  </script>
</body>
</html>
